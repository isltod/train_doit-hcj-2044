<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Array 객체의 메서드</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			font-size: 1.2em;
		}

		hr {
			width: 100%;
		}
	</style>
</head>

<body>
	<div class="container">
		<script>
			// Do it! Array 객체의 다양한 메서드 연습하기

			let nums = [1, 2, 3];
			let chars = ["a", "b", "c", "d"];

			// 두 개의 배열 합치기
			let numsChars = nums.concat(chars);
			let charsNums = chars.concat(nums);
			document.writeln(`nums에 chars를 합치면: ${numsChars}, <br> chars에 nums를 합치면: ${charsNums}`);
			document.writeln('<hr>');

			// 배열 안의 요소 합치기
			let str1 = nums.join();
			document.writeln(`구분자 없이: ${str1}<br>`);
			let str2 = chars.join('/');
			document.writeln(`/ 구분자 지정: ${str2}`);
			document.writeln('<hr>')

			// 요소 추가 - 새로운 length 값 반환
			let ret1 = nums.push(4, 5);
			document.writeln(`length: ${ret1} | 배열: ${nums}<br>`);
			let ret2 = nums.unshift(0);
			document.writeln(`length: ${ret2} | 배열: ${nums}`);
			document.writeln('<hr>')

			// 요소 추출 - 꺼낸 요소 반환
			let popped1 = chars.pop();
			document.writeln(`꺼낸 요소: ${popped1}, | 배열: ${chars}<br>`);
			let popped2 = chars.shift();
			document.writeln(`꺼낸 요소: ${popped2}, | 배열: ${chars}`);
			document.writeln('<hr>')
		</script>
	</div>
</body>

</html>
