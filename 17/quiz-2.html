<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>연습문제 2</title>
</head>

<body>
	<script>
		let n1 = prompt('비교할 첫 번째 숫자:');
		let n2 = prompt('비교할 두 번째 숫자:');
		function compare(a, b) {
			if (a === b) { alert('같습니다') } else { alert(`${Math.max(a, b)}(이)가 ${Math.min(a, b)}보다 큽니다.`) };
		}
		if (n1 !== null && n2 !== null) { compare(parseInt(n1), parseInt(n2)) };
	</script>
</body>

</html>
