<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조건문</title>
</head>

<body>
  <script>
    //  Do it! OR 연산자를 사용해 조건 체크하기 
    let num1 = parseInt(prompt('50 미만인 숫자를 입력하세요.'));
    let num2 = parseInt(prompt('50 미만 숫자 한 번 더!'));
    if (num1 < 10 || num2 < 10) {
      alert('숫자 둘 중 최소한 하나는 10 미만이군요.')
    } else {
      alert('숫자 둘 다 10보다 크군요.')
    }
  </script>
</body>

</html>
