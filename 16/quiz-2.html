<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>연습문제 2</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			font-size: 1.2em;
		}

		p {
			color: #f00;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<h2>3의 배수 찾기</h2>
	<script>
		let endNum = prompt('몇 까지 3의 배수를 찾을까요?');
		if (endNum !== null) {
			let count = 0;
			for (let i = 1; i <= parseInt(endNum); i++) {
				if (i % 3 === 0) {
					count++;
					document.write(`${i}, `);
				}
			}
			document.write(`<br>${endNum}까지 3의 배수의 갯수: ${count}`)
		}
	</script>
</body>

</html>
